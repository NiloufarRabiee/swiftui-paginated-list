name: Bug report
description: Report unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add PaginatedList...
        2. Configure the page loader...
        3. Scroll near the end...
        4. Observe...
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: iOS 18, macOS 15, etc.
    validations:
      required: true

  - type: input
    id: xcode
    attributes:
      label: Xcode version
      placeholder: Xcode 16.x
